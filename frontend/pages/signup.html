<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — Urban Furniture Accounting System</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <!-- Custom Project CSS -->
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-surface d-flex align-items-center justify-content-center min-vh-100 p-3" style="padding-top:0;">

  <div class="card border-0 shadow-lg" style="max-width: 480px; width: 100%; border-radius: 8px; overflow: hidden;">
    <div class="card-header border-0 text-center py-4" style="background-color: var(--color-dark-blue);">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
        <span class="material-symbols-outlined text-warning" style="font-size: 32px;">chair</span>
        <span class="fs-4 fw-bold text-white tracking-tight">Urban Furniture</span>
      </div>
      <span class="badge bg-secondary text-dark text-uppercase font-label-caps" style="letter-spacing: 0.08em;">Account Registration</span>
    </div>

    <div class="card-body p-4 bg-white">
      <h5 class="fw-bold mb-1 text-dark">Create User Account</h5>
      <p class="text-muted small mb-4">Request access to the accounting ledger workspace</p>

      <form action="../index.html" method="GET">
        <div class="mb-3">
          <label class="form-label font-title-md small fw-semibold text-secondary">Full Name</label>
          <input type="text" class="form-control" placeholder="e.g. Rajesh Sharma" required/>
        </div>

        <div class="mb-3">
          <label class="form-label font-title-md small fw-semibold text-secondary">Work Email Address</label>
          <input type="email" class="form-control" placeholder="rajesh@urbanfurniture.com" required/>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label font-title-md small fw-semibold text-secondary">Password</label>
            <input type="password" class="form-control" placeholder="••••••••" required/>
          </div>
          <div class="col-6">
            <label class="form-label font-title-md small fw-semibold text-secondary">Confirm Password</label>
            <input type="password" class="form-control" placeholder="••••••••" required/>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label font-title-md small fw-semibold text-secondary">Assign System Role</label>
          <select class="form-select">
            <option value="accountant">Accountant (Read/Write Journal Entries)</option>
            <option value="admin">Administrator (Full System Access)</option>
            <option value="contact">Contact / Customer Portal</option>
          </select>
        </div>

        <button type="submit" class="btn btn-gold w-100 py-2 d-flex align-items-center justify-content-center gap-2">
          <span>Register Account</span>
          <span class="material-symbols-outlined fs-6">check_circle</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <span class="small text-muted">Already have an account?</span>
        <a href="../index.html" class="small fw-semibold text-decoration-none ms-1 text-primary">Sign In Here</a>
      </div>
    </div>
  </div>

</body>
</html>
