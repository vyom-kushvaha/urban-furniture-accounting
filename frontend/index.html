<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Urban Furniture Accounting System</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <!-- Custom Project CSS -->
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-surface d-flex align-items-center justify-content-center min-vh-100 p-3" style="padding-top:0;">

  <div class="card border-0 shadow-lg" style="max-width: 420px; width: 100%; border-radius: 8px; overflow: hidden;">
    <div class="card-header border-0 text-center py-4" style="background-color: var(--color-dark-blue);">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
        <span class="material-symbols-outlined text-warning" style="font-size: 32px;">chair</span>
        <span class="fs-4 fw-bold text-white tracking-tight">Urban Furniture</span>
      </div>
      <span class="badge bg-secondary text-dark text-uppercase font-label-caps" style="letter-spacing: 0.08em;">Enterprise Ledger ERP</span>
    </div>

    <div class="card-body p-4 bg-white">
      <h5 class="fw-bold mb-1 text-dark">Sign in to your account</h5>
      <p class="text-muted small mb-4">Enter your credentials to access the ledger system</p>

      <!-- Alert for displaying backend error messages -->
      <div id="loginErrorAlert" class="alert alert-danger d-none small py-2 mb-3" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label font-title-md small fw-semibold text-secondary">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <span class="material-symbols-outlined fs-6">mail</span>
            </span>
            <input type="email" id="loginEmail" class="form-control border-start-0 ps-0" placeholder="admin@urbanfurniture.com" required value="admin@urbanfurniture.com"/>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label font-title-md small fw-semibold text-secondary mb-0">Password</label>
            <a href="#" class="small text-decoration-none text-muted">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <span class="material-symbols-outlined fs-6">lock</span>
            </span>
            <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" required value="password123"/>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked/>
          <label class="form-check-label small text-muted" for="rememberMe">Remember this browser</label>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-dark-blue w-100 py-2 d-flex align-items-center justify-content-center gap-2">
          <span>Sign In</span>
          <span class="material-symbols-outlined fs-6">arrow_forward</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <span class="small text-muted">Don't have an account?</span>
        <a href="pages/signup.html" class="small fw-semibold text-decoration-none ms-1" style="color: var(--color-burnt-orange);">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Custom Auth Integration JS -->
  <script src="js/auth.js"></script>
</body>
</html>
